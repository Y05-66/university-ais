version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ais-mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root@2026
      MYSQL_DATABASE: ueas
      MYSQL_USER: ais
      MYSQL_PASSWORD: ais@2026
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init:/docker-entrypoint-initdb.d
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max-connections=500
    networks:
      - ais-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot@2026"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ais-redis
    restart: always
    ports:
      - "6380:6379"
    command: >
      redis-server
      --requirepass ais@2026
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ais-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "ais@2026", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:

networks:
  ais-network:
    driver: bridge
