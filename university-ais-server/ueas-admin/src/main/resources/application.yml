server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: university-ais
  profiles:
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/ueas?characterEncoding=utf-8&useUnicode=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&initSql=SET+names+utf8mb4
    username: ais
    password: ais@2026
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-init-sql: SET NAMES utf8mb4

  data:
    redis:
      host: localhost
      port: 6380
      password: ais@2026
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    default-character-set: UTF-8
    deserialization:
      fail-on-unknown-properties: false


  ai:
    openai:
      api-key: ${AI_API_KEY:sk-placeholder}
      base-url: ${AI_BASE_URL:https://apihub.agnes-ai.com}
      chat:
        options:
          model: agnes-2.5-flash
          temperature: 0.7

# 自定义配置
ueas:
  avatar:
    dir: D:/university academic system/uploads/avatars/
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: university-system-y
    prefix: avatars/

# Sa-Token 配置
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  is-log: false
  # 指定 SaToken 数据访问对象实现类（使用 Redis）
  dao-class: com.ais.system.config.SaTokenDaoRedisImpl

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    use-generated-keys: false
    default-fetch-size: 100
    default-statement-timeout: 30

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# 日志
logging:
  level:
    com.ais: debug
    com.ais.mapper: debug
